
name: CD - Publicar imágenes

# ---------- 1) TRIGGERS (CUÁNDO SE DISPARA) ----------
# Regla de seguridad: nunca se publica desde un Pull Request, solo
# desde código ya aprobado en main o en una versión etiquetada.
on:
  push:
    branches: [main]            # Se dispara al hacer merge de un PR a main
    tags: ['v*.*.*']            # Se dispara con releases: git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:            #  agrega un botón manual Run workflow en GitHub Actions

# Evita que dos publicaciones simultáneas sobre la misma rama se pisen entre sí.
# cancel-in-progress: false garantiza que la publicación en curso termine completa.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# Principio de mínimo privilegio para el GITHUB_TOKEN temporal:
# solo puede leer el repositorio y subir paquetes a GHCR; al terminar el job caduca.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Lee primero las variables/secrets de Settings -> Environments -> production.
    # Si no existen allí, hereda automáticamente las del repositorio.
    environment: production
    strategy:
      fail-fast: false          # Si falla un servicio, igual intenta terminar el otro para ver ambos logs
      # Usamos include para separar el nombre de la imagen (service)
      # de la carpeta real donde vive cada Dockerfile (context).
      matrix:
        include:
          - service: api
            context: ./api-taskflow
          - service: web
            context: ./frontend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # 1/4 Action oficial de Docker: activa Buildx (motor moderno con caché en GitHub Actions)
      - name: Preparar Buildx (necesario para caché y build-push)
        uses: docker/setup-buildx-action@v3

      # ---------- 2) LOGIN A LOS REGISTROS ----------
      # 2/4 Action oficial de Docker: inicia sesión en GHCR sin crear tokens manuales.
      # GITHUB_TOKEN lo inyecta GitHub automáticamente en cada corrida.
      - name: Login a GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mientras esa variable no exista, GitHub salta este paso sin marcar error.
      - name: Login a Docker Hub (opcional)
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- 3) ESTRATEGIA DE TAGS ----------
      # 3/4 Action oficial de Docker: calcula los tags inmutables y labels automáticamente.
      - name: Calcular nombres, tags y labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/taskflow-${{ matrix.service }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/taskflow-${{ matrix.service }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=sha,prefix=sha-                                 # Ej: sha-3f2a1c9 (inmutable, trazable al commit)
            type=raw,value=latest,enable={{is_default_branch}}   # Solo pone "latest" cuando el push es a main
            type=semver,pattern={{version}}                      # Con tag v1.0.0 genera 1.0.0
            type=semver,pattern={{major}}.{{minor}}              # Con tag v1.0.0 también genera 1.0

      # ---------- 4) BUILD Y PUSH ----------
      # 4/4 Action oficial de Docker: construye desde la carpeta real y sube la imagen a GHCR.
      - name: Build y push de taskflow-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}                         # Usa ./api-taskflow o ./frontend según la matriz
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Las labels incluyen org.opencontainers.image.source:
          # esto vincula los paquetes el repositorio para que salgan en la pestaña Packages.
          labels: ${{ steps.meta.outputs.labels }}
          # Inyecta la URL del backend al ARG VITE_API_URL de frontend/Dockerfile.
          # api-taskflow/Dockerfile no declara ese ARG, así que simplemente lo ignora.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3008' }}
          # Caché separada por servicio (scope) para que api y web no se sobreescriban la caché
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Imprime un resumen limpio con los tags generados en la vista principal del run en Actions
      - name: Resumen
        run: |
          echo "### taskflow-${{ matrix.service }} publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

 