server{
    listen 80;
    server_name _; # garantiza que la web funcione en cualquier servidor
    root /usr/share/nginx/html;
    index index.html;


    location / {
        try_files $uri /index.html; # cualquier ruta de React Router  devuelve index.html
    }

    #controla el cache de vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


}